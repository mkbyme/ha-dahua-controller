create_preset:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: dahua_controller
    name:
      required: true
      example: "Cổng chính"
      selector:
        text:
    preset_number:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 255
          mode: box

get_presets:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: dahua_controller

delete_preset:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: dahua_controller
    preset_number:
      required: true
      example: 6
      selector:
        number:
          min: 1
          max: 255
          mode: box
